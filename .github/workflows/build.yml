name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc --noEmit` first, so type errors fail the build
      - name: Type-check and build
        run: npm run build

      - name: Test password-protection middleware
        run: npm test

      - name: Check serverless functions load
        run: |
          node --check server/pvwatts-core.mjs
          node -e "import('./api/pvwatts.js').then(m => { if (typeof m.GET !== 'function') process.exit(1) })"
          node -e "import('./netlify/functions/pvwatts.mjs').then(m => { if (typeof m.default !== 'function') process.exit(1) })"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
