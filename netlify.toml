[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing: serve index.html for every path.
# Netlify Functions (/.netlify/functions/*) are matched before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
