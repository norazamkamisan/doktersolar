[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Same API path as Vercel: /api/pvwatts → the Netlify Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Client-side routing: serve index.html for every other path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
